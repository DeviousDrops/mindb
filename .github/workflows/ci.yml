name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  GO_VERSION: "1.25"

jobs:
  # Both architectures run the whole suite natively. arm64 is the deploy
  # target, and it is not the same build: the cascade is off there, so the
  # brute-force path is what actually serves queries and it deserves the same
  # scrutiny. Running it under QEMU instead would be ~20x slower and would make
  # -race useless, since the detector's timing assumptions do not survive
  # emulation.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^pkg/mindb/'))
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # The engine is a single RWMutex over shared slabs, so the race detector
      # is the only thing that can prove the read paths are actually read-only.
      # It needs cgo and a native toolchain, which is why it runs here rather
      # than in the cross-build job.
      - name: test -race
        run: go test -race ./...

  # A missing build tag on an architecture-specific file is invisible to a
  # native build -- that is exactly how the arm64 build stayed broken. Only a
  # cross-build catches it, and it covers architectures no runner above does.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: vet every supported architecture
        run: make check-cross

  # flatc and the FlatBuffers Go runtime are a matched pair and a mismatch does
  # not fail the build: it shifts vtable offsets and shows up as garbage fields
  # at runtime. This is the only thing stopping the committed generated code and
  # fbs/mindb.fbs from drifting apart unnoticed.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: regenerate and diff
        run: make check-gen

  # The image is built on every push and pushed only on a tag, so the
  # Dockerfile breaks in a pull request rather than for the first time during a
  # release. QEMU is registered for the manifest list, not for compiling: the
  # builder stage runs on the native platform and Go cross-compiles, so the
  # arm64 leg is a cross-build rather than an emulated toolchain.
  image:
    needs: [test, cross, generated]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.repository tracks the owner, so a repo transfer needs no edit
      # here. metadata-action lowercases it for the registry.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long

      - name: build (and push on a tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
