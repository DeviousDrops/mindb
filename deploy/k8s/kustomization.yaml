# kubectl apply -k deploy/k8s
#
# Then the dashboard, which lives with the docker-compose stack:
#   kubectl -n mindb create configmap grafana-dashboards \
#     --from-file=deploy/observability/grafana/dashboards/mindb.json \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mindb
resources:
  - namespace.yaml
  - mindb.yaml
  - prometheus.yaml
  - grafana.yaml
# Generated ConfigMaps get a content hash in their name, and kustomize rewrites
# the references to match, so editing prometheus.yml rolls Prometheus.
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: grafana-datasource
    files:
      - prometheus.yml=grafana-datasource.yml
  - name: grafana-dashboard-providers
    files:
      - mindb.yml=grafana-dashboards.yml
